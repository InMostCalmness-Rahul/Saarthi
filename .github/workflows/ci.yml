name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        node-version: ["24.x"]
        python-version: ["3.11"]

    env:
      # Optional: add the GROQ_API_KEY repository secret to exercise the live model.
      # Without it the AI service uses its (test-covered) fallback path.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_BASE_URL: ${{ secrets.GROQ_API_BASE_URL }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GROQ_TEMPERATURE: ${{ secrets.GROQ_TEMPERATURE }}

      MONGODB_URI: mongodb://127.0.0.1:27017/saarthi
      AI_SERVICE_URL: http://127.0.0.1:8000
      # Non-secret CI-only values: the session-token signing key and the shared
      # secret between the backend and the AI service.
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789
      AI_SERVICE_API_KEY: ci-only-internal-key
      INTERNAL_API_KEY: ci-only-internal-key
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install backend deps
        working-directory: ./backend
        run: |
          npm ci

      - name: Lint backend
        working-directory: ./backend
        run: |
          npm run lint

      - name: Test backend (unit + HTTP contract)
        working-directory: ./backend
        run: |
          npm test

      - name: Install ai_service deps (runtime + dev)
        working-directory: ./ai_service
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint ai_service (ruff)
        working-directory: ./ai_service
        run: |
          ./venv/bin/python -m ruff check .

      - name: Test ai_service (pytest)
        working-directory: ./ai_service
        run: |
          ./venv/bin/python -m pytest

      - name: Install frontend deps
        working-directory: ./frontend
        run: |
          npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm run build

      - name: Start ai_service (uvicorn) in background
        working-directory: ./ai_service
        run: |
          . venv/bin/activate
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 --log-level info > ai_service.log 2>&1 &
          sleep 1

      - name: Start backend in background
        working-directory: ./backend
        run: |
          nohup npm start > backend.log 2>&1 &
          sleep 1

      - name: Wait for services to become available
        run: |
          set -e
          echo "Waiting for AI service (http://127.0.0.1:8000) to be ready..."
          ai_ready=false
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "AI service is up"
              ai_ready=true
              break
            fi
            echo -n '.'; sleep 1
          done
          if [ "$ai_ready" != "true" ]; then
            echo "AI service did not become ready"
            exit 1
          fi

          echo "Waiting for Backend (http://127.0.0.1:5000) to be ready..."
          backend_ready=false
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:5000/health >/dev/null 2>&1; then
              echo "Backend is up"
              backend_ready=true
              break
            fi
            echo -n '.'; sleep 1
          done
          if [ "$backend_ready" != "true" ]; then
            echo "Backend did not become ready"
            exit 1
          fi

      - name: Run ai_service smoke test
        env:
          AI_SERVICE_URL: http://127.0.0.1:8000
        run: |
          ai_service/venv/bin/python ai_service/smoke_generate_response.py

      - name: Run backend smoke test
        env:
          BACKEND_URL: http://127.0.0.1:5000
        run: |
          cd backend && npm run test:smoke-chat

      - name: Run backend end-to-end flow
        env:
          BACKEND_URL: http://127.0.0.1:5000
        run: |
          cd backend && npm run test:e2e-chat

      - name: Collect logs and Summary
        if: always()
        run: |
          echo "CI finished. Collecting service logs..."
          echo "---- ai_service log ----"
          if [ -f ai_service/ai_service.log ]; then tail -n +1 ai_service/ai_service.log || true; fi
          echo "---- backend log (last 200 lines) ----"
          tail -n 200 backend/backend.log || true
          echo "Done."
