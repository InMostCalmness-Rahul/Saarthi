<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saarthi | Relational AI Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape shape-1" aria-hidden="true"></div>
    <div class="bg-shape shape-2" aria-hidden="true"></div>

    <main class="app-shell">
      <aside class="panel side-panel">
        <div class="brand-block">
          <p class="brand-kicker">Saarthi</p>
          <h1>Your bridge from feeling stuck to moving forward.</h1>
          <p class="brand-copy">
            Talk openly. Get grounded. Reconnect with people and progress one small step at a time.
          </p>
        </div>

        <div class="trust-card">
          <p class="label">Trust Phase</p>
          <h2 id="trustPhase">Listening Mode</h2>
          <p id="trustHint" class="hint">
            I am focused on understanding what you are feeling without pushing you too fast.
          </p>
          <div class="meter">
            <span id="trustMeterBar"></span>
          </div>
          <p class="score"><span id="trustScore">30</span>/100</p>
        </div>
      </aside>

      <section class="panel chat-panel" aria-label="Chat with Saarthi">
        <header class="chat-header">
          <div>
            <p class="label">Companion Chat</p>
            <h2>Saarthi AI</h2>
          </div>
          <button id="resetBtn" class="ghost-btn" type="button">Reset</button>
        </header>

        <div id="chatWindow" class="chat-window" aria-live="polite"></div>

        <form id="chatForm" class="chat-form">
          <label for="messageInput" class="sr-only">Type your message</label>
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Share what is weighing on you..."
            required
          ></textarea>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <template id="messageTemplate">
      <article class="msg-row">
        <div class="avatar"></div>
        <div class="bubble"></div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
